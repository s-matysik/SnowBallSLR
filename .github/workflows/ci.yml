name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,loglinear]"
      - name: Lint
        run: ruff check snowballslr tests
      - name: Type check
        run: mypy snowballslr
        continue-on-error: true
      - name: Test (no network available to the suite)
        run: pytest --cov=snowballslr --cov-report=term-missing --cov-fail-under=90
      - name: Determinism under hash randomization
        run: PYTHONHASHSEED=random pytest tests/test_determinism.py
