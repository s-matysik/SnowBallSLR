[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snowballslr"
version = "1.0.0"
description = "Deterministic, saturation-aware snowballing for systematic literature reviews"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Sebastian Matysik" }]
keywords = [
    "systematic-review", "snowballing", "citation-searching", "prisma",
    "capture-recapture", "reproducibility", "bibliometrics", "openalex",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "rapidfuzz>=3.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.2",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
loglinear = ["statsmodels>=0.14", "pandas>=2.0"]
viz = ["matplotlib>=3.8"]
dev = [
    "pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100",
    "ruff>=0.5", "mypy>=1.10", "respx>=0.21",
]
all = ["snowballslr[embeddings,loglinear,viz]"]

[project.urls]
Homepage = "https://github.com/s-matysik/SnowBallSLR"
Repository = "https://github.com/s-matysik/SnowBallSLR"
Issues = "https://github.com/s-matysik/SnowBallSLR/issues"

[project.scripts]
snowballslr = "snowballslr.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["snowballslr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:snowballslr.*"]

[tool.coverage.run]
source = ["snowballslr"]
omit = ["snowballslr/ranking/embedding.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
